<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — HibroAura</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#526447">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:#f7f8f5;min-height:100vh}
    .login{min-height:100vh;display:grid;place-items:center;padding:20px}
    .login__card{width:100%;max-width:400px;background:#fff;border:1px solid var(--border);border-radius:24px;padding:36px 30px;display:flex;flex-direction:column;gap:14px}
    .login__card h1{font-size:1.6rem;margin:0}.login__err{color:var(--burgundy);font-size:.88rem;min-height:1.2em}
    .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
    .side{background:#fff;border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
    .side__brand{font-weight:700;font-size:1.15rem;color:var(--green);padding:4px 12px 16px}
    .side button{text-align:left;padding:11px 14px;border-radius:10px;font-size:.92rem;color:var(--charcoal);min-height:44px}
    .side button[aria-current=true]{background:var(--sage);color:var(--green-dark);font-weight:600}
    .side button:hover{background:#f1f4ee}.side__out{margin-top:auto;color:var(--burgundy)!important}
    .main{padding:clamp(18px,4vw,40px);max-width:980px;width:100%}
    .main h1{font-size:1.7rem;margin:0 0 20px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
    .stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}.stat b{display:block;font-size:1.9rem;color:var(--green)}.stat span{font-size:.82rem;color:var(--grey)}
    .acard{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:18px}
    .acard h3{margin:0 0 4px;font-size:1.1rem}.muted{color:var(--grey);font-size:.88rem;margin:0 0 14px}
    .acard__body{display:grid;gap:14px}.acard__foot{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
    .imgf{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
    .imgf__prev{width:110px;height:110px;border-radius:14px;background:var(--sage);display:grid;place-items:center;overflow:hidden;font-size:.72rem;color:var(--grey);text-align:center;flex:none}
    .imgf__prev img{width:100%;height:100%;object-fit:cover}
    .imgf__ctl{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}.imgf__ctl small{color:var(--grey)}
    .imgf__ctl button,.mini{font-size:.8rem;padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:#fff;min-height:34px}
    .afield{display:flex;flex-direction:column;gap:5px}.afield label{font-size:.82rem;font-weight:600}
    .afield input,.afield select,.afield textarea,.ba-row input{width:100%;padding:11px 13px;border:1px solid #d9d4d0;border-radius:10px;font:inherit;background:#fff}
    .afield input[type=checkbox]{width:auto}.chk{flex-direction:row;align-items:center;gap:8px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .ba-row{border:1px dashed #d9d4d0;border-radius:14px;padding:14px;display:grid;gap:12px;margin-bottom:12px}
    .tbl{width:100%;border-collapse:collapse;font-size:.88rem}.tbl th,.tbl td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
    .tbl img{width:44px;height:44px;object-fit:cover;border-radius:8px;background:var(--sage)}
    .scroll{overflow-x:auto}.pill-s{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.74rem;background:var(--sage)}
    .pill-s.pending{background:#fdf0d5}.pill-s.rejected{background:var(--blush)}
    .acts{display:flex;gap:6px;flex-wrap:wrap}.danger{color:var(--burgundy)!important}
    #flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:12px 20px;border-radius:12px;font-size:.88rem;z-index:500;display:none;max-width:90vw}
    #flash.err{background:var(--burgundy)}
    @media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--border)}.side__brand{display:none}.side button{white-space:nowrap}.side__out{margin-top:0}.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="admin-root"></div>
  <div id="flash" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
